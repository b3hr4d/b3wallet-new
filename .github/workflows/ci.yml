name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The PocketIC server the pocket-ic crate pins (LATEST_SERVER_VERSION).
  # No checksum is published with the release; this one was recorded from the
  # first download on 2026-10-20, so a changed binary fails the job.
  POCKET_IC_VERSION: 16.1.0
  POCKET_IC_SHA256: 131219d90dcf9bf6f3ed8ee02d8f55504ea24a6db382f5680675b7bd6b7ed3bf
  # The ICRC-1 ledger the PocketIC tests install as the ICP ledger and as a
  # token. The checksum is the one the release lists in its SHA256SUMS.
  ICRC1_LEDGER_RELEASE: ledger-suite-icrc-2025-09-01
  ICRC1_LEDGER_SHA256: 24e6b0b09ba44b1123453877994bb59ce75555c2e33f19f58163a3e0c6e62bd1
  # The Bitcoin Core node the regtest tests start. The checksum is the one
  # all 16 builders of the release signed in bitcoin-core/guix.sigs.
  BITCOIN_CORE_VERSION: "31.1"
  BITCOIN_CORE_SHA256: b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e

jobs:
  wallet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The upgrade test builds the previous release from history.
          fetch-depth: 0

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (canister target)
        run: cargo clippy -p wallet -p release_channel -p caller --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Unit, interface and release tool tests
        run: cargo test --workspace --exclude integration --locked -- --nocapture

      # The previous release is the pull request's base, or on main the commit
      # before. It builds in its own target directory: both builds write
      # wallet.wasm under the same name, and a shared directory can leave one
      # release's Wasm where the other's should be.
      - name: Build the previous release's Wasm
        env:
          PREVIOUS: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add --detach "${RUNNER_TEMP}/previous" "${PREVIOUS}"
          cargo build --manifest-path "${RUNNER_TEMP}/previous/Cargo.toml" \
            --target-dir "${RUNNER_TEMP}/previous-target" \
            -p wallet --target wasm32-unknown-unknown --release --locked
          echo "PREVIOUS_WALLET_WASM=${RUNNER_TEMP}/previous-target/wasm32-unknown-unknown/release/wallet.wasm" >> "${GITHUB_ENV}"

      # The caller canister lets the PocketIC tests call as a canister.
      - name: Build the wallet, release channel and caller Wasm
        run: cargo build -p wallet -p release_channel -p caller --target wasm32-unknown-unknown --release --locked

      - name: Download the PocketIC server
        run: |
          curl -sSfL -o pocket-ic.gz \
            "https://github.com/dfinity/pocketic/releases/download/${POCKET_IC_VERSION}/pocket-ic-x86_64-linux.gz"
          echo "${POCKET_IC_SHA256}  pocket-ic.gz" | sha256sum --check
          gunzip pocket-ic.gz
          chmod +x pocket-ic
          echo "POCKET_IC_BIN=${PWD}/pocket-ic" >> "${GITHUB_ENV}"

      - name: Download the ICRC-1 ledger Wasm
        run: |
          curl -sSfL -o ic-icrc1-ledger.wasm.gz \
            "https://github.com/dfinity/ic/releases/download/${ICRC1_LEDGER_RELEASE}/ic-icrc1-ledger.wasm.gz"
          echo "${ICRC1_LEDGER_SHA256}  ic-icrc1-ledger.wasm.gz" | sha256sum --check
          echo "ICRC1_LEDGER_WASM=${PWD}/ic-icrc1-ledger.wasm.gz" >> "${GITHUB_ENV}"

      - name: Download Bitcoin Core
        run: |
          curl -sSfL -o bitcoin-core.tar.gz \
            "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_CORE_VERSION}/bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${BITCOIN_CORE_SHA256}  bitcoin-core.tar.gz" | sha256sum --check
          tar -xzf bitcoin-core.tar.gz
          echo "BITCOIND=${PWD}/bitcoin-${BITCOIN_CORE_VERSION}/bin/bitcoind" >> "${GITHUB_ENV}"
          echo "BITCOIN_CLI=${PWD}/bitcoin-${BITCOIN_CORE_VERSION}/bin/bitcoin-cli" >> "${GITHUB_ENV}"

      - name: PocketIC tests, with the upgrade from the previous release, regtest and a 100 MiB release
        run: cargo test -p integration --locked -- --include-ignored

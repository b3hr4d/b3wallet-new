# icp-cli project: the wallet, release channel and factory canisters and a
# local network whose Bitcoin canister follows a regtest node on
# 127.0.0.1:18444, as scripts/try-local.sh starts one.
canisters:
  - name: wallet
    recipe:
      type: "@dfinity/rust@v3.2.0"
      configuration:
        package: wallet
        candid: candid/wallet.did
  - name: release_channel
    recipe:
      type: "@dfinity/rust@v3.2.0"
      configuration:
        package: release_channel
        candid: candid/release_channel.did
  - name: factory
    recipe:
      type: "@dfinity/rust@v3.2.0"
      configuration:
        package: factory
        candid: candid/factory.did

networks:
  - name: local
    mode: managed
    # An exact launcher, so starting the network never asks the GitHub API
    # which release is the latest.
    version: v16.0.0-2026-09-18-03-28
    # The ICP ledger, at its mainnet id, with local ICP for your identity.
    nns: true
    # Internet Identity at id.ai.localhost:8000, where the wallet's pages
    # sign in on this network.
    ii: true
    bitcoind-addr:
      - "127.0.0.1:18444"

[workspace]
resolver = "3"
members = [
  "canisters/controller",
  "canisters/factory",
  "canisters/release_channel",
  "canisters/wallet",
  "crates/recovery",
  "crates/release",
  "tests/caller",
  "tests/evm_rpc_mock",
  "tests/integration",
  "tools/recovery-tool",
  "tools/release-tool",
]

[workspace.package]
edition = "2024"
publish = false

# Every direct dependency is pinned exactly; Cargo.lock pins the rest.
[workspace.dependencies]
# Bitcoin addresses, transactions and their signature hashes. No default
# features: no randomness and no global signing context.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
candid = "=0.10.38"
candid_parser = "=0.4.1"
# The wallet only verifies: no precomputed tables, no randomness.
ed25519-dalek = { version = "=2.2.0", default-features = false }
# Certified pages (decision 0001); response verification in tests only.
ic-asset-certification = "=4.0.0"
ic-cdk = "=0.20.3"
# The Bitcoin canister's interface types and what each of its methods costs.
ic-cdk-bitcoin-canister = "=0.2.0"
ic-http-certification = "=4.0.0"
ic-response-verification = "=4.0.0"
ic-stable-structures = "=0.7.2"
# ICRC-1 accounts, their text form, and the ledger's transfer types.
icrc-ledger-types = "=0.2.0"
pocket-ic = "=16.1.0"
# Property tests only; no fork or timeout support needed.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# The curve under `bitcoin`, named to build it with small precomputed tables
# (the default ones add about 1 MB of gzipped Wasm) and with recovery, which
# gives an EVM signature the parity of its curve point.
secp256k1 = { version = "=0.29.1", default-features = false, features = ["lowmemory", "recovery"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_bytes = "=0.11.19"
# The EVM RPC mock reads the JSON-RPC requests the wallet sends (tests only),
# and the recovery tool reads icp-cli's JSON; already under candid_parser.
serde_json = "=1.0.154"
# Chunk and manifest hashes; already under ed25519-dalek.
sha2 = { version = "=0.10.9", default-features = false }
# Keccak-256 of EVM addresses and transactions; already under candid_parser.
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

# SHA-256 at "s" takes 127 instructions a byte in the Wasm, and at 3 about 75:
# the release channel hashes every byte of a release twice in one call.
[profile.release.package.sha2]
opt-level = 3

[workspace]
resolver = "3"
members = ["canisters/wallet", "tests/integration"]

[workspace.package]
edition = "2024"
publish = false

# Every direct dependency is pinned exactly; Cargo.lock pins the rest.
[workspace.dependencies]
candid = "=0.10.38"
candid_parser = "=0.4.1"
# The wallet only verifies: no precomputed tables, no randomness.
ed25519-dalek = { version = "=2.2.0", default-features = false }
# Certified pages (decision 0001); response verification in tests only.
ic-asset-certification = "=4.0.0"
ic-cdk = "=0.20.3"
ic-http-certification = "=4.0.0"
ic-response-verification = "=4.0.0"
ic-stable-structures = "=0.7.2"
# ICRC-1 accounts, their text form, and the ledger's transfer types.
icrc-ledger-types = "=0.2.0"
pocket-ic = "=16.1.0"
# Property tests only; no fork or timeout support needed.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_bytes = "=0.11.19"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
